# One-click release: Actions -> Release -> choose patch/minor/major.
# Runs the full CI gate, bumps package.json, pushes the "Release vX.Y.Z" commit + tag to
# master, publishes to npm via trusted publishing (OIDC — no npm token), then creates a
# GitHub Release with generated notes.
#
# One-time setup (see README "Releasing"):
#   - secret RELEASE_DEPLOY_KEY: a write deploy key. The ruleset that protects master lists
#     "Deploy keys" as a bypass actor; GITHUB_TOKEN cannot bypass, so the version commit must
#     be pushed over this key.
#   - npmjs.com -> ripple-qa -> Settings -> Trusted Publisher: this repo + release.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      dry_run:
        description: Dry run — run everything but push nothing and publish nothing
        type: boolean
        default: false

# Never run two releases at once; never cancel one either.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push commit + tag, create the GitHub Release
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - name: Real releases only from master
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::Release must be dispatched from master (got ${{ github.ref }}). Re-run with dry_run=true to exercise it from a branch."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Empty when the secret is not set (dry runs before setup) -> checkout falls back
          # to token auth, which is enough for everything except the real push.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # prepublishOnly runs `npm test` on every publish (dry-run included), and the suite
      # imports third-party packages, so the runner needs node_modules.
      - run: npm ci

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@11
          npm --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" -m "Release v%s"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$version"

      # Push BEFORE publish: publishing is the only irreversible step (a version number is
      # burned even after unpublish). A rejected push (misconfigured deploy key, master moved
      # since dispatch) then costs nothing. --atomic: both refs land or neither does.
      - name: Push commit and tag
        id: push
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin HEAD:master "refs/tags/v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        id: publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --verify-tag

      # Only when the publish itself failed after the push landed: remove the tag so a retry's
      # --verify-tag cannot pick up a tag with no package behind it. The version commit stays
      # on master; recovery is "fix the cause, dispatch again" (which bumps once more).
      # Deliberately NOT bare failure(): if `gh release create` fails after a successful publish,
      # the version is live on npm and the tag must stay — create the Release by hand from the
      # existing tag instead. failure() is still needed as the status function: without one,
      # GitHub prepends an implicit success() and the step would never run after a failure.
      - name: Remove tag after a failed publish
        if: ${{ failure() && steps.push.outcome == 'success' && steps.publish.outcome == 'failure' }}
        run: git push --delete origin "refs/tags/v${{ steps.bump.outputs.version }}"

      - name: Summary
        if: ${{ always() && steps.bump.outcome == 'success' }}
        run: |
          v="${{ steps.bump.outputs.version }}"
          {
            echo "## Release v$v"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**DRY RUN** — nothing pushed, nothing published."
            else
              echo "- npm: https://www.npmjs.com/package/ripple-qa/v/$v"
              echo "- GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
